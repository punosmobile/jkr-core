# Creates a GitHub Release with the wheel and the CHANGELOG entry of the version.
# Triggers: a pushed tag v*, a manual run, or a call from the prod deploy
# (workflow_call), which creates the tag on the deployed commit.
# The version must match pyproject.toml. An existing release is skipped.

name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version without v, e.g. 0.9.0 (default: pyproject.toml)"
        required: false
  workflow_call:
    inputs:
      version:
        description: "Version without v, e.g. 0.9.0 (default: pyproject.toml)"
        type: string
        required: false

permissions:
  contents: read

jobs:
  release:
    name: Create release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          project=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version=${GITHUB_REF_NAME#v}
          else
            version=${INPUT_VERSION:-$project}
          fi
          if [ "$version" != "$project" ]; then
            echo "::error::Version $version does not match pyproject.toml ($project)."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "::warning::Release v$version already exists, skipping."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Read CHANGELOG entry
        if: steps.version.outputs.exists != 'true'
        id: changelog
        uses: mindsers/changelog-reader-action@1faaf50aa09d5793d9a100819973df801febfb31 # v2.4.0
        with:
          version: ${{ steps.version.outputs.version }}
          path: ./CHANGELOG.md

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.version.outputs.exists != 'true'
        with:
          python-version: "3.11"

      - name: Build wheel and sdist
        if: steps.version.outputs.exists != 'true'
        run: |
          python -m pip install --upgrade pip poetry
          poetry build

      # Creates the tag on this commit if it does not exist yet (prod deploy call).
      - name: Create GitHub release
        if: steps.version.outputs.exists != 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: v${{ steps.version.outputs.version }}
          body: ${{ steps.changelog.outputs.changes }}
          files: dist/*.whl
